name: Bug report
description: Something in SyncBridge does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Please leave out private file names, folder names and personal data.
        GitHub issues are public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings › Folders
        2. …
  - type: input
    id: version
    attributes:
      label: SyncBridge and macOS version
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: From the menu, Open Sync Log. Remove private names before pasting.
      render: text
